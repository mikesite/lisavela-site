<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lisa Vela</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #f9fafb; }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen p-6">
    <div class="max-w-md w-full bg-white rounded-2xl shadow-xl p-8 text-center">
        <div class="w-24 h-24 bg-gray-200 rounded-full mx-auto mb-4 overflow-hidden border-4 border-blue-50">
            <img src="SillyLisa.jpg" alt="Lisa Vela" class="w-full h-full object-cover">
        </div>
        
        <h1 class="text-3xl font-bold text-gray-900">Lisa Vela</h1>
        <p class="text-blue-600 font-medium mb-4">Professional & Creative</p>
        
        <p class="text-gray-600 mb-8 leading-relaxed">
            Welcome! I'm currently working on creating and posting a resume. In the meantime, feel free to reach out via the form below.  Thanks!
        </p>

        <form action="https://formspree.io/f/xkobyzvj" method="POST" class="text-left space-y-4">
            <div>
                <label class="block text-sm font-medium text-gray-700">Email Address</label>
                <input type="email" name="email" required class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700">Message</label>
                <textarea name="message" required class="w-full px-4 py-2 border rounded-lg h-24 focus:ring-2 focus:ring-blue-500 outline-none"></textarea>
            </div>
            <button type="submit" class="w-full bg-blue-600 text-white font-bold py-2 rounded-lg hover:bg-blue-700 transition">Send Message</button>
        </form>

        <div class="mt-8 pt-6 border-t flex justify-center space-x-6 text-gray-400">
            <a href="#" class="hover:text-blue-600">LinkedIn</a>
            <a href="#" class="hover:text-blue-400">Twitter</a>
            <a href="#" class="hover:text-pink-500">Instagram</a>
        </div>
    </div>
</body>
</html>
